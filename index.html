      function showToast(message, type = "success") {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        const bgCol =
          type === "success"
            ? "bg-emerald-600"
            : type === "error"
              ? "bg-rose-600"
              : "bg-amber-600";
        const icon =
          type === "success"
            ? "fa-circle-check"
            : type === "error"
              ? "fa-circle-xmark"
              : "fa-triangle-exclamation";

        toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-white font-medium text-sm ${bgCol} animate-fade-in transition-all duration-300`;
        toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span>${message}</span>`;
        container.appendChild(toast);

        setTimeout(() => {
          toast.style.opacity = "0";
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      function render() {
        const app = document.getElementById("app");
        if (!appState.currentUser) {
          app.innerHTML =
            appState.activeTab === "register"
              ? renderRegisterPage()
              : renderLoginPage();
        } else {
          app.innerHTML = renderDashboardLayout();
        }
        bindEvents();
      }

          payments: "Konfirmasi Pembayaran",
          complaints: "Pengaduan & Pemeliharaan",
          reports: "Laporan & Ekspor Data",
        };
        return titles[tab] || tab;
      }

        appState.modal = { open: false, type: null, data: null };
        render();
      }

        const number = document.getElementById("m-room-num").value;

      function submitPayment(e, billId) {
        e.preventDefault();
        const method = document.getElementById("m-pay-method").value;
        const bill = mockData.bills.find((b) => b.id === billId);

        mockData.payments.push({
          id: Date.now(),
          tenantName: appState.currentUser.name,
          billId,
          amount: bill.amount,
          date: new Date().toISOString().split("T")[0],
          method,
          proof: "bukti_transfer_baru.jpg",
          status: "Pending",

        closeModal();
        showToast(
          "Bukti pembayaran berhasil diunggah! Menunggu verifikasi admin.",

        switch (appState.activeTab) {

            return renderProfileTab();
          case "rooms":
            return renderRoomsTab();
          case "tenants":
            return renderTenantsTab();
          case "rent-requests":
            return renderRentRequestsTab();
          case "bills":
            return renderBillsTab();
          case "payments":
            return renderPaymentsTab();
          case "complaints":
            return renderComplaintsTab();
          case "reports":
            return renderReportsTab();
          default:
            return renderDashboardTab();

              name: "Pengguna Test",
              email,
              role: "penghuni",

              phone: "0812345678",
              avatar:

              room,
              avatar:
                "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150",
            };
            mockData.users.push(newUser);
            mockData.tenants.push({
              id: newUser.id,
              name,
              email,
              phone,
              room,
              joinDate: new Date().toISOString().split("T")[0],
              status: "Aktif",
            });

            appState.currentUser = newUser;
            appState.activeTab = "dashboard";
            showToast("Registrasi berhasil! Akun Anda telah aktif.");
            render();
          };
        }
      }

      window.onload = function () {
        render();
      };
    </script>
